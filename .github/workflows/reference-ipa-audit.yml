name: Audit Reference All-Skins IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-ipa-audit.yml"

permissions:
  contents: read

jobs:
  audit-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Unity analysis dependencies
        run: pip install -r requirements.txt

      - name: Download and verify reference IPA
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          url = "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CS2._1.4.1_.5.8.78.2.ipa"
          expected = "7b20f04d493c60cf5e215c0a82050fa691105fc47a0748e46e55cc3078f9cc9f"
          request = urllib.request.Request(url, headers={"User-Agent": "CounterFlame-Reference-Audit/1.0"})
          digest = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(request, timeout=300) as response, open("reference.ipa", "wb") as output:
              while True:
                  chunk = response.read(8 * 1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
                  digest.update(chunk)
                  total += len(chunk)
          actual = digest.hexdigest()
          print(f"Downloaded {total} bytes; SHA256={actual}")
          if actual != expected:
              raise SystemExit(f"Reference IPA SHA256 mismatch: {actual}")
          PY

      - name: Verify IPA archive
        run: python -m zipfile -t reference.ipa

      - name: Scan IPA structure and skin catalog
        run: |
          python src/ipa_scanner.py reference.ipa --out reports/reference --targets config/target_skins.json
          python src/unity_asset_inspector.py reference.ipa --out reports/reference --targets config/target_skins.json
          python src/unity_full_bundle_index.py reference.ipa --out reports/reference
          python src/unity_model_graph.py reference.ipa --out reports/reference
          python src/unity_rig_animation_map.py reference.ipa --out reports/reference
          python src/unity_skin_weight_audit.py reference.ipa --out reports/reference
          python src/unity_mesh_renderer_link_audit.py reference.ipa --out reports/reference/mesh_renderer
          python src/unity_skin_component_audit.py reference.ipa --out reports/reference/skin_components

      - name: Upload reference IPA audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-all-skins-ipa-audit
          path: reports/reference/
          if-no-files-found: warn
          retention-days: 14
