name: Extract Reference Local Inventory Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-reference-runtime.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify reference IPA
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CS2._1.4.1_.5.8.78.2.ipa"
          expected = "7b20f04d493c60cf5e215c0a82050fa691105fc47a0748e46e55cc3078f9cc9f"
          req = urllib.request.Request(url, headers={"User-Agent":"CounterFlame-Inventory-Audit/1.0"})
          h = hashlib.sha256()
          with urllib.request.urlopen(req, timeout=300) as r, open("reference.ipa","wb") as f:
              while True:
                  b = r.read(8 * 1024 * 1024)
                  if not b: break
                  f.write(b); h.update(b)
          actual = h.hexdigest()
          print("reference IPA SHA256:", actual)
          if actual != expected: raise SystemExit("Reference IPA checksum mismatch")
          PY
      - name: Extract inventory runtime evidence
        run: |
          python - <<'PY'
          import zipfile, pathlib, json, hashlib, plistlib
          z = zipfile.ZipFile("reference.ipa")
          names = z.namelist()
          app_root = "Payload/CounterFlame.app/"
          targets = {
            "CounterFlameKAlert551.dylib": [n for n in names if n == app_root + "Frameworks/CounterFlameKAlert551.dylib"],
            "global-metadata.dat": [n for n in names if n.startswith(app_root) and n.endswith("/global-metadata.dat")],
            "UnityFramework": [n for n in names if n == app_root + "Frameworks/UnityFramework.framework/UnityFramework"],
            "Info.plist": [n for n in names if n == app_root + "Info.plist"],
          }
          out = pathlib.Path("runtime-evidence"); out.mkdir()
          report = {"source":"reference IPA","sha256":"7b20f04d493c60cf5e215c0a82050fa691105fc47a0748e46e55cc3078f9cc9f","app_root":app_root,"files":{}}
          for label, hits in targets.items():
              if not hits:
                  report["files"][label] = {"status":"not_found"}
                  continue
              if len(hits) != 1:
                  raise SystemExit(f"Ambiguous {label}: {hits}")
              data = z.read(hits[0])
              (out / label).write_bytes(data)
              report["files"][label] = {"ipa_path":hits[0],"size":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          plist = plistlib.loads(z.read(app_root + "Info.plist"))
          executable = plist.get("CFBundleExecutable")
          if executable:
              exe_path = app_root + executable
              if exe_path in names:
                  exe_data = z.read(exe_path)
                  (out/"CounterFlame").write_bytes(exe_data)
                  report["files"]["MainExecutable"] = {"ipa_path":exe_path,"size":len(exe_data),"sha256":hashlib.sha256(exe_data).hexdigest(),"bundle_executable":executable}
              else:
                  report["files"]["MainExecutable"] = {"status":"not_found","bundle_executable":executable}
          (out/"manifest.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          if report["files"]["CounterFlameKAlert551.dylib"].get("status") == "not_found":
              raise SystemExit("Reference inventory dylib missing")
          PY
      - name: Inspect Mach-O injection and linkage evidence
        run: |
          python - <<'PY'
          import struct, json, pathlib
          root = pathlib.Path("runtime-evidence")
          def inspect(path):
              data = path.read_bytes()
              if data[:4] != b"\xcf\xfa\xed\xfe":
                  raise SystemExit(f"Unsupported Mach-O magic in {path.name}: {data[:4].hex()}")
              header = struct.unpack_from("<IiiIIIII", data, 0)
              ncmds, offset = header[4], 32
              dylib_cmds = {0xc:"LC_LOAD_DYLIB",0x80000018:"LC_LOAD_WEAK_DYLIB",0x8000001f:"LC_REEXPORT_DYLIB",0x80000023:"LC_LOAD_UPWARD_DYLIB",0xd:"LC_ID_DYLIB"}
              found = []
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", data, offset)
                  if cmd in dylib_cmds and cmdsize >= 24:
                      nameoff = struct.unpack_from("<I", data, offset+8)[0]
                      raw = data[offset+nameoff:offset+cmdsize].split(b"\0",1)[0]
                      found.append({"command":dylib_cmds[cmd],"name":raw.decode("utf-8","replace")})
                  offset += cmdsize
              return {"file":path.name,"bytes":len(data),"cpu_type":header[1],"file_type":header[3],"load_commands":found}
          app = inspect(root/"CounterFlame")
          tweak = inspect(root/"CounterFlameKAlert551.dylib")
          install = next((x["name"] for x in tweak["load_commands"] if x["command"]=="LC_ID_DYLIB"),None)
          app_loads = [x["name"] for x in app["load_commands"] if x["command"]!="LC_ID_DYLIB"]
          report = {
            "scope":"Static Mach-O load-command inspection only; no code execution.",
            "main_executable":app,
            "reference_module":tweak,
            "reference_module_install_name":install,
            "main_executable_directly_loads_reference_module":any(x.endswith("CounterFlameKAlert551.dylib") for x in app_loads),
            "install_name_indicates_mobile_substrate_injection_path":bool(install and "/Library/MobileSubstrate/DynamicLibraries/" in install),
            "interpretation":"A MobileSubstrate install name is evidence consistent with an injected tweak deployment. It does not alone prove the exact injector, filter plist, or runtime execution."
          }
          (root/"macho-linkage-analysis.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY
      - name: Produce local-inventory symbol triage
        run: |
          python - <<'PY'
          import re, json, pathlib
          root = pathlib.Path("runtime-evidence")
          data = (root / "CounterFlameKAlert551.dylib").read_bytes()
          strings = [x.decode("utf-8","replace") for x in re.findall(rb"[ -~]{4,}", data)]
          terms = ("inventory","arsenal","cosmetic","skin","glove","knife","weapon","stattrak","sticker","equip","visualize","setskin","getskin","createitems","playerprefs","local-preview")
          hits = []
          for i, s in enumerate(strings):
              if any(t in s.lower() for t in terms):
                  hits.append({"index":i,"text":s[:300]})
          report = {
            "scope":"Read-only printable-string triage only; no binary modification or runtime execution.",
            "dylib_bytes":len(data),
            "printable_string_count":len(strings),
            "inventory_related_strings":hits
          }
          (root/"inventory-symbol-triage.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          lines = ["# Local inventory symbol triage","",f"- Dylib bytes: {len(data)}",f"- Printable strings: {len(strings)}",f"- Matched strings: {len(hits)}","","String evidence is not proof of runtime behavior."]
          lines += [f"- [{h['index']}] {h['text']}" for h in hits]
          (root/"inventory-symbol-triage.md").write_text("\n".join(lines),encoding="utf-8")
          print(f"Found {len(hits)} inventory-related printable strings.")
          PY
      - name: Upload runtime evidence and triage
        uses: actions/upload-artifact@v4
        with:
          name: reference-inventory-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
