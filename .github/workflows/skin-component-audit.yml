name: Audit Skin Runtime Component Links
# Re-run after correcting the component audit parser

on:
  push:
    branches: [main]
    paths:
      - "src/unity_skin_component_audit.py"
      - ".github/workflows/skin-component-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Unity asset tools
        run: pip install -r requirements.txt
      - name: Download and verify original IPA
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CounterFlame-1.4.1-c7-ios.2.ipa"
          expected = "6c3e740ca379c5daf55f635e1228414230ca4acb7608cd7b35e7f5c0e0d952d3"
          req = urllib.request.Request(url, headers={"User-Agent":"CounterFlame-Component-Audit/1.0"})
          h=hashlib.sha256()
          with urllib.request.urlopen(req, timeout=240) as src, open("input.ipa","wb") as dst:
              while True:
                  chunk=src.read(8*1024*1024)
                  if not chunk: break
                  dst.write(chunk); h.update(chunk)
          actual=h.hexdigest()
          print("SHA256:",actual)
          if actual != expected: raise SystemExit("IPA hash mismatch")
          PY
      - name: Audit weapon and skin MonoBehaviour links
        run: python src/unity_skin_component_audit.py input.ipa --out reports/skin_component_audit
      - name: Upload focused component report
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-skin-component-audit
          path: reports/skin_component_audit/skin_monobehaviour_links.json
          if-no-files-found: error
          retention-days: 14
