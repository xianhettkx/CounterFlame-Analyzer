<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>CounterFlame · Local Armory</title>
<style>
:root{color-scheme:dark;--bg:#0c0f16;--panel:#151a25;--panel2:#1b2230;--line:#293244;--text:#edf2fa;--muted:#8e9aaf;--accent:#f0a44b;--green:#75d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#28344b 0,transparent 42%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 18px 14px;max-width:900px;margin:auto}small,.muted{color:var(--muted)}h1{font-size:24px;margin:0 0 5px;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted)}main{max-width:900px;margin:auto;padding:0 14px 40px}.notice{background:#2a2118;border:1px solid #62462b;color:#f5d5ad;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin:8px 0 15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:11px}input{flex:1;min-width:150px}select{min-width:112px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:13px;min-height:155px;display:flex;flex-direction:column;gap:8px}.item.active{border-color:var(--accent);box-shadow:0 0 0 1px #f0a44b33 inset}.kind{font-size:10px;letter-spacing:1px;color:var(--accent);text-transform:uppercase}.name{font-weight:700;font-size:14px;line-height:1.35}.weapon{font-size:12px;color:var(--muted)}.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px}.status{font-size:10px;color:var(--green)}button{cursor:pointer;background:#263247;border-color:#3a4963;font-size:12px;padding:8px 11px}button.primary{background:var(--accent);border-color:var(--accent);color:#17130e;font-weight:700}button:active{transform:scale(.98)}.bottom{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.bottom h2{font-size:15px;margin:0 0 10px}.equip{display:flex;align-items:center;justify-content:space-between;gap:12px}.equip strong{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px}.foot{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><h1>COUNTERFLAME <span style="color:var(--accent)">/ ARMORY</span></h1><div class="sub">LOCAL COSMETIC PREVIEW · 离线外观收藏夹</div></header>
<main><div class="notice">此页面是独立的本地外观目录与预览选择器。选择结果只保存在本机浏览器，不会解锁游戏账号、修改服务器库存，也不会自动注入或改写 IPA。当前只收录仓库中已核实映射的 6 款外观。</div>
<div class="toolbar"><input id="search" placeholder="搜索武器或皮肤名称…" autocomplete="off"><select id="category"><option value="全部">全部类别</option><option>刀具</option><option>手套</option><option>步枪</option><option>狙击枪</option><option>手枪</option></select><select id="sort"><option value="name">名称排序</option><option value="weapon">武器排序</option></select></div>
<div id="grid" class="grid"></div>
<section class="bottom"><h2>本地装备槽</h2><div class="equip"><div><div class="muted" style="font-size:11px">当前选择</div><strong id="equipped">尚未选择</strong></div><span class="status" id="saved">LOCAL ONLY</span></div><div class="actions"><button class="primary" id="export">导出本地配置 JSON</button><button id="reset">清空本地选择</button></div><div class="foot">配置文件可用于后续离线预览工具读取；不会被游戏服务器识别为真实拥有的饰品。素材渲染和 IPA 重签需要独立验证，当前页面不宣称已完成游戏内生效。</div></section></main>
<script>
const SKINS=[
{key:"butterfly_marblefade",name:"Butterfly Knife | Marble Fade",weapon:"蝴蝶刀",category:"刀具",rarity:"特殊刀具",model:"v_knife_t_v_knife_flip_reference",status:"资源映射已记录"},
{key:"specialist_pillow",name:"Specialist Gloves | Pillow Punchers",weapon:"Specialist Gloves",category:"手套",rarity:"手套",model:"v_glove_ct_specialist",status:"资源映射已记录"},
{key:"awp_dragonlore",name:"AWP | Dragon Lore",weapon:"AWP",category:"狙击枪",rarity:"隐秘",model:"v_snip_awp_awp_model",status:"资源映射已记录"},
{key:"ak47_neonrevolution",name:"AK-47 | Neon Revolution",weapon:"AK-47",category:"步枪",rarity:"隐秘",model:"v_rif_ak47_reference1",status:"资源映射已记录"},
{key:"m4a4_emperor",name:"M4A4 | The Emperor",weapon:"M4A4",category:"步枪",rarity:"隐秘",model:"v_rif_m4a1_reference1",status:"资源映射已记录"},
{key:"deagle_codered",name:"Desert Eagle | Code Red",weapon:"沙漠之鹰",category:"手枪",rarity:"隐秘",model:"v_pist_deagle_deagle_model",status:"资源映射已记录"}
];
const KEY="cf_local_cosmetic_preview_v1";let selected=localStorage.getItem(KEY)||"";
const $=id=>document.getElementById(id);
function render(){let q=$("search").value.trim().toLowerCase(),cat=$("category").value,rows=SKINS.filter(x=>(cat==="全部"||x.category===cat)&&[x.name,x.weapon,x.key].join(" ").toLowerCase().includes(q));if($("sort").value==="weapon")rows.sort((a,b)=>a.weapon.localeCompare(b.weapon));else rows.sort((a,b)=>a.name.localeCompare(b.name));$("grid").innerHTML=rows.length?rows.map(x=>'<article class="item '+(selected===x.key?'active':'')+'"><div class="kind">'+x.category+' · '+x.rarity+'</div><div class="name">'+x.name+'</div><div class="weapon">'+x.weapon+' / '+x.model+'</div><div class="meta"><span class="status">'+x.status+'</span><button data-key="'+x.key+'" class="'+(selected===x.key?'primary':'')+'">'+(selected===x.key?'已选择':'选择外观')+'</button></div></article>').join(""):'<div class="empty">没有找到匹配的外观</div>';$("equipped").textContent=(SKINS.find(x=>x.key===selected)||{}).name||"尚未选择";$("saved").textContent=selected?"已保存到本机":"LOCAL ONLY";document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>{selected=b.dataset.key;localStorage.setItem(KEY,selected);render()}))}
["search","category","sort"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
$("reset").addEventListener("click",()=>{selected="";localStorage.removeItem(KEY);render()});
$("export").addEventListener("click",()=>{const skin=SKINS.find(x=>x.key===selected)||null;const data={schema_version:1,mode:"local_preview_only",game:"CounterFlame",selected_skin:skin,exported_at:new Date().toISOString(),server_inventory_modified:false,account_entitlements_modified:false,anti_cheat_or_network_modified:false};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="counterflame-local-preview.json";a.click();URL.revokeObjectURL(url)});
render();
</script></body></html>
