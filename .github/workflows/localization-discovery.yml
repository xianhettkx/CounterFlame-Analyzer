name: Localization String Discovery (Read Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/unity_localization_discovery.py'
      - '.github/workflows/localization-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Unity asset tools
        run: pip install -r requirements.txt
      - name: Download and verify original IPA
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          url = "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CounterFlame-1.4.1-c7-ios.2.ipa"
          expected = "6c3e740ca379c5daf55f635e1228414230ca4acb7608cd7b35e7f5c0e0d952d3"
          req = urllib.request.Request(url, headers={"User-Agent":"CounterFlame-Localization-Audit/1.0"})
          digest=hashlib.sha256(); total=0
          with urllib.request.urlopen(req,timeout=180) as response, open("input.ipa","wb") as output:
              while True:
                  chunk=response.read(8*1024*1024)
                  if not chunk: break
                  output.write(chunk); digest.update(chunk); total+=len(chunk)
          actual=digest.hexdigest()
          print(f"Downloaded {total} bytes; SHA256={actual}")
          if actual != expected: raise SystemExit("Original IPA SHA256 verification failed")
          PY
      - name: Discover candidate UI strings (read only)
        run: python src/unity_localization_discovery.py input.ipa --out reports/localization_discovery
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-localization-discovery
          path: reports/localization_discovery/localization_string_inventory.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
