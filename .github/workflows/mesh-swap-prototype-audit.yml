name: Mesh Swap Prototype Audit

on:
  push:
    branches: [main]
    paths:
      - "src/ipa_package_diff.py"
      - "src/unity_mesh_swap_prototype.py"
      - "src/unity_mesh_plan.py"
      - "src/unity_mesh_swap_plan.py"
      - "config/local_skin_pseudo_entity_map.json"
      - ".github/workflows/mesh-swap-prototype-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/unity_mesh_swap_prototype.py"
      - "src/unity_mesh_plan.py"
      - "src/unity_mesh_swap_plan.py"
      - "config/local_skin_pseudo_entity_map.json"
      - ".github/workflows/mesh-swap-prototype-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Unity asset tools
        run: pip install -r requirements.txt
      - name: Download and verify both IPA builds
        run: |
          python - <<'PY'
          import hashlib, urllib.request
          builds = {
              "original": {
                  "url": "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CounterFlame-1.4.1-c7-ios.2.ipa",
                  "sha256": "6c3e740ca379c5daf55f635e1228414230ca4acb7608cd7b35e7f5c0e0d952d3",
              },
              "provided_candidate": {
                  "url": "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CS2._1.4.1_.5.8.78.2.ipa",
                  "sha256": "7b20f04d493c60cf5e215c0a82050fa691105fc47a0748e46e55cc3078f9cc9f",
              },
          }
          for name, item in builds.items():
              target = f"{name}.ipa"
              req = urllib.request.Request(item["url"], headers={"User-Agent":"CounterFlame-Mesh-Swap-Audit/1.0"})
              digest = hashlib.sha256()
              with urllib.request.urlopen(req, timeout=600) as src, open(target,"wb") as dst:
                  while True:
                      chunk = src.read(8*1024*1024)
                      if not chunk: break
                      dst.write(chunk)
                      digest.update(chunk)
              actual = digest.hexdigest()
              print(f"{name} SHA256: {actual}")
              if actual != item["sha256"]:
                  raise SystemExit(f"{name} IPA SHA256 mismatch")
          PY
      - name: Compare complete IPA package contents
        run: |
          mkdir -p reports/package_diff
          python src/ipa_package_diff.py original.ipa provided_candidate.ipa --out reports/package_diff/ipa_package_diff.json | tee reports/package_diff/summary.log
      - name: Audit original IPA
        run: |
          mkdir -p reports/original
          python src/unity_mesh_swap_prototype.py original.ipa --out reports/original/mesh_swap 2>&1 | tee reports/original/audit.log
          python src/unity_mesh_renderer_link_audit.py original.ipa --out reports/original/renderer_links
          python src/unity_renderer_owner_context_audit.py original.ipa --out reports/original/renderer_owner_context
      - name: Audit provided candidate IPA
        run: |
          mkdir -p reports/provided_candidate
          python src/unity_mesh_swap_prototype.py provided_candidate.ipa --out reports/provided_candidate/mesh_swap 2>&1 | tee reports/provided_candidate/audit.log
          python src/unity_mesh_renderer_link_audit.py provided_candidate.ipa --out reports/provided_candidate/renderer_links
          python src/unity_renderer_owner_context_audit.py provided_candidate.ipa --out reports/provided_candidate/renderer_owner_context
      - name: Upload comparative mesh swap audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-original-vs-provided-candidate-audit
          path: reports/
          if-no-files-found: error
          retention-days: 14
