name: Analyze CounterFlame IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/analyze.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: pip install -r requirements.txt

      - name: Run scanner tests
        run: python -m unittest discover -s tests -v

      - name: Download public IPA release asset
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          url = "https://github.com/xianhettkx/CounterFlame-Analyzer/releases/download/ipa-v1/CounterFlame-1.4.1-c7-ios.2.ipa"
          expected = "6c3e740ca379c5daf55f635e1228414230ca4acb7608cd7b35e7f5c0e0d952d3"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "CounterFlame-Analyzer/1.0"},
          )
          digest = hashlib.sha256()
          total = 0

          with urllib.request.urlopen(request, timeout=180) as response, open("input.ipa", "wb") as output:
              while True:
                  chunk = response.read(8 * 1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
                  digest.update(chunk)
                  total += len(chunk)

          actual = digest.hexdigest()
          print(f"Downloaded {total} bytes.")
          if actual != expected:
              raise SystemExit(f"SHA256 mismatch: {actual}")
          print("SHA256 verified.")
          PY

      - name: Verify archive and scan
        run: |
          python -m zipfile -t input.ipa
          python src/ipa_scanner.py input.ipa --out reports --targets config/target_skins.json
          python src/unity_asset_inspector.py input.ipa --out reports --targets config/target_skins.json
          python src/unity_full_bundle_index.py input.ipa --out reports
          python src/unity_model_graph.py input.ipa --out reports
          python src/unity_rig_animation_map.py input.ipa --out reports
          python src/unity_skin_weight_audit.py input.ipa --out reports
          python src/unity_target_asset_export.py input.ipa --reports reports --out reports/exported
          python src/unity_glb_rig_export.py input.ipa --reports reports --out reports/exported

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-analysis-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
